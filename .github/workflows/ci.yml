name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - name: Run integration tests
        run: npm run test:integration

      - name: Build
        run: |
          set -a
          source .env.test
          set +a
          npm run build
