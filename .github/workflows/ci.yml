name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5434/auth_starter_test"
      BETTER_AUTH_SECRET: "test-secret-not-for-production-use-only-testing"
      BETTER_AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - name: Run integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
